name: Sync Hugging Face access
on:
  workflow_dispatch:
    inputs:
      sources:
        description: 'Optional entry dataset IDs; leave empty to use all public auto-gated HumanCOIN datasets'
        required: false
        type: string
      apply:
        description: 'Grant access (false previews only)'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: hf-access-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'huggingface_hub>=0.34,<2'
      - name: Preview or apply grants
        env:
          HF_ACCESS_TOKEN: ${{ secrets.HF_ACCESS_TOKEN }}
          ACCESS_SOURCES: ${{ inputs.sources }}
          ACCESS_APPLY: ${{ inputs.apply }}
        run: |
          python - <<'PY'
          import os
          from scripts.sync_hf_access import main
          import sys
          sources = os.environ.get('ACCESS_SOURCES', '').split()
          sys.argv = ['sync_hf_access']
          sys.argv += ['--source', *sources] if sources else ['--all-sources']
          if os.environ['ACCESS_APPLY'] == 'true':
              sys.argv.append('--apply')
          raise SystemExit(main())
          PY
