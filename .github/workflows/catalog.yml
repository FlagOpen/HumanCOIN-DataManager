name: Refresh HumanCOIN catalog
on:
  schedule:
    - cron: '0 0,1 * * *' # 08:00 and 09:00 Asia/Shanghai
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    permissions:
      contents: write
      pages: read
    outputs:
      artifact_name: ${{ steps.pages_artifact.outputs.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync catalog metadata
        env:
          HF_TOKEN: ${{ secrets.HF_ACCESS_TOKEN }}
          MODELSCOPE_TOKEN: ${{ secrets.MS_ACCESS_TOKEN }}
        run: |
          python -m pip install 'PyYAML>=6,<7'
          python scripts/sync_catalog.py
      - run: npm test && npm run check
      # GITHUB_TOKEN commits do not trigger a second push workflow; deploy in this workflow.
      - name: Commit catalog snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data sync-state
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh HumanCOIN catalog'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Name Pages artifact
        id: pages_artifact
        run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.pages_artifact.outputs.name }}
          path: docs
  deploy:
    needs: refresh
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
        with:
          artifact_name: ${{ needs.refresh.outputs.artifact_name }}
